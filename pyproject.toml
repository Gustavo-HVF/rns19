[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expro"
version = "1.0.0"
description = "PROJETO EXPRO (EXplosion PROtection): bloqueio e alerta para detonações (NR-19)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ['tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
jupyter = ["ipywidgets>=7.7"]
mqtt = ["paho-mqtt>=2.0"]
raspberry = ["gpiozero>=2.0"]
dev = ["pytest>=7", "ipywidgets>=7.7", "paho-mqtt>=2.0", "gpiozero>=2.0"]

[project.scripts]
expro = "expro.cli:main"

[tool.setuptools]
packages = ["expro", "expro.adaptadores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
